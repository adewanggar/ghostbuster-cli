[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghostbuster-cli"
version = "0.1.0"
description = "Find and bust the ghosts haunting your codebase - unused deps, dead code, orphan files, and phantom env vars."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Ghostbuster Contributors" },
]
keywords = [
    "cli",
    "dead-code",
    "unused-dependencies",
    "code-quality",
    "linter",
    "developer-tools",
    "devtools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
ghostbuster = "ghostbuster.cli.app:app"

[project.urls]
Homepage = "https://github.com/adewanggar/ghostbuster-cli"
Documentation = "https://github.com/adewanggar/ghostbuster-cli#readme"
Repository = "https://github.com/adewanggar/ghostbuster-cli"
Issues = "https://github.com/adewanggar/ghostbuster-cli/issues"
Changelog = "https://github.com/adewanggar/ghostbuster-cli/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostbuster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # ruff-specific rules
]
ignore = [
    "B008",   # function call in default args (required by Typer)
    "E501",   # line too long (handled by formatter)
    "E741",   # ambiguous variable name (short vars in comprehensions are fine)
    "N801",   # class name should use CapWords (private classes can be lowercase)
    "UP007",  # use X | Y for union (we want 3.10 compat)
    "TC003",  # move stdlib import into type-checking block (readability over perf)
    "RUF002", # ambiguous unicode in docstrings (× is intentional)
    "RUF003", # ambiguous unicode in comments (× is intentional)
]

[tool.ruff.lint.isort]
known-first-party = ["ghostbuster"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
mypy_path = "src"
packages = ["ghostbuster"]
